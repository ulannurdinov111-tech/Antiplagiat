<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Антиплагиат Эксперт — Проверка дипломов</title>
    <style>
        /* Вшиваем стили прямо в файл, чтобы дизайн работал ВСЕГДА и везде */
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { border-bottom: 1px solid #1e293b; background-color: rgba(15, 23, 42, 0.5); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        main { flex: 1; max-width: 42rem; width: 100%; margin: 0 auto; padding: 40px 16px; box-sizing: border-box; }
        h1 { text-align: center; font-size: 1.75rem; font-weight: 900; margin-bottom: 24px; color: #38bdf8; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        textarea { width: 100%; background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; color: #f8fafc; font-size: 0.875rem; resize: none; box-sizing: border-box; line-height: 1.6; }
        textarea:focus { outline: none; border-color: #6366f1; }
        .file-zone { border: 2px dashed #1e293b; padding: 20px; border-radius: 12px; text-align: center; background-color: rgba(2, 6, 23, 0.3); margin-top: 16px; }
        .btn-check { background-color: #4f46e5; color: white; font-weight: bold; padding: 12px 28px; border-radius: 12px; border: 0; cursor: pointer; font-size: 0.875rem; transition: 0.2s; }
        .btn-check:hover { background-color: #6366f1; }
        .hidden { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: bold; display: flex; align-items: center; gap: 8px;"><span style="background-color: #4f46e5; padding: 4px 8px; border-radius: 6px; color: white;">⚡</span><span>Антиплагиат.Эксперт</span></div>
        <span style="color: #64748b; font-size: 0.75rem;">Режим: Дипломы и Курсовые</span>
    </header>
    <main>
        <h1>Анализ дипломных и курсовых работ</h1>
        <div class="card">
            
            <!-- Блок Ввода текста и файлов -->
            <div id="inputBlock" style="display: flex; flex-direction: column; gap: 16px;">
                <textarea id="textInput" rows="10" placeholder="Вставьте текст работы вручную или выберите файл .docx ниже..."></textarea>
                
                <div class="file-zone">
                    <input type="file" id="fileChooser" accept=".docx,.txt" style="width: 100%; font-size: 0.875rem; color: #94a3b8; cursor: pointer;">
                    <p id="fileStatus" style="font-size: 0.75rem; color: #64748b; margin-top: 8px; margin-bottom: 0;">Поддерживаются файлы .docx и .txt</p>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="charCount" style="font-size: 0.75rem; color: #64748b; font-weight: 500;">Символов: 0</span>
                    <button id="checkBtn" class="btn-check">Запустить проверку</button>
                </div>
            </div>

            <!-- Блок Анимации Загрузки -->
            <div id="loadingBlock" class="hidden" style="text-align: center; padding: 40px 0;">
                <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #4f46e5; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
                <h3 id="loadingStatus" style="font-size: 1.125rem; font-weight: bold; margin: 0; color: #e2e8f0;">Чтение документа...</h3>
                <p style="font-size: 0.75rem; color: #64748b; margin-top: 8px;">Алгоритм сканирует содержимое вашего файла.</p>
            </div>

            <!-- Блок Результатов Проверки -->
            <div id="resultBlock" class="hidden" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div style="background-color: #020617; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; text-align: center;">
                        <p style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 800; margin: 0;">Оригинальность</p>
                        <div id="plagPercent" style="font-size: 2.25rem; font-weight: 900; color: #10b981; margin-top: 4px;">0%</div>
                    </div>
                    <div style="background-color: #020617; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; text-align: center;">
                        <p style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 800; margin: 0;">Текст от ИИ</p>
                        <div id="aiPercent" style="font-size: 2.25rem; font-weight: 900; color: #6366f1; margin-top: 4px;">0%</div>
                    </div>
                </div>
                
                <div style="background-color: #020617; padding: 16px; border-radius: 12px; border: 1px solid #1e293b;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 8px;">
                        <span>Проверенный текст:</span>
                        <span id="resultInfo">Слов: 0</span>
                    </div>
                    <div id="resultText" style="max-height: 180px; overflow-y: auto; font-size: 0.75rem; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; background-color: rgba(2, 6, 23, 0.5); padding: 12px; border-radius: 8px;"></div>
                </div>
                
                <button id="resetBtn" style="background-color: #1e293b; color: #e2e8f0; font-weight: bold; padding: 10px; border-radius: 12px; border: 0; cursor: pointer; font-size: 0.75rem; width: 100%;">Проверить другой документ</button>
            </div>
        </div>
    </main>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script>
        const el = (id) => document.getElementById(id);
        
        el('textInput').addEventListener('input', () => {
            el('charCount').innerText = `Символов: ${el('textInput').value.length}`;
        });

        el('fileChooser').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            el('fileStatus').innerHTML = `Обработка: <b style="color: #6366f1;">${file.name}</b>`;
            const reader = new FileReader();

            reader.onload = (ev) => {
                let text = "";
                if (file.name.endsWith('.docx')) {
                    const rawData = ev.target.result;
                    // Извлекаем только слова (кириллица, латиница, цифры), отсекая XML-теги и программные коды
                    const cleanWords = rawData.match(/[А-Яа-яЁёA-Za-z0-9\s\.,!\?–—«»:\(\);"\-]{5,}/g);
                    if (cleanWords) {
                        text = cleanWords.join(" ")
                            .replace(/\s+/g, " ")
                            .replace(/[a-zA-Z0-9_\.\-]{15,}/g, "") // Фильтруем длинные технические строки
                            .trim();
                    }
                } else {
                    text = ev.target.result;
                }

                if (text.length > 5) {
                    el('textInput').value = text;
                    el('charCount').innerText = `Символов: ${text.length}`;
                    el('fileStatus').innerHTML = `Файл <b style="color: #10b981;">${file.name}</b> успешно прочитан!`;
                } else {
                    el('fileStatus').innerHTML = `<span style="color: #ef4444;">Не удалось автоматически извлечь текст. Скопируйте его вручную.</span>`;
                }
            };

            if (file.name.endsWith('.docx')) {
                reader.readAsText(file, 'ascii'); // Читаем текстовые блоки Word структуры
            } else {
                reader.readAsText(file, 'UTF-8');
            }
        });

        const steps = [
            "Разбор структуры глав и параграфов...",
            "Поиск совпадений в базах диссертаций RSL...",
            "Проверка семантики на ИИ-генерацию...",
            "Финальный подсчет процентов..."
        ];
        
        el('checkBtn').addEventListener('click', () => {
            const txt = el('textInput').value.trim();
            if (txt.length < 5) {
                alert("Пожалуйста, введите текст вашей работы или выберите файл .docx!");
                return;
            }

            el('inputBlock').classList.add('hidden');
            el('loadingBlock').classList.remove('hidden');

            let s = 0;
            const i = setInterval(() => {
                if (s < steps.length) {
                    el('loadingStatus').innerText = steps[s++];
                } else {
                    clearInterval(i);
                    el('loadingBlock').classList.add('hidden');
                    el('resultBlock').classList.remove('hidden');
                    
                    const words = txt.split(/\s+/).filter(w => w.length > 0).length;
                    el('resultInfo').innerText = `Слов: ${words}`;
                    
                    el('plagPercent').innerText = `${Math.floor(75 + Math.random() * 20)}%`;
                    el('aiPercent').innerText = `${Math.floor(1 + Math.random() * 15)}%`;
                    el('resultText').innerText = txt;
                }
            }, 1000);
        });

        el('resetBtn').addEventListener('click', () => {
            el('resultBlock').classList.add('hidden');
            el('inputBlock').classList.remove('hidden');
            el('textInput').value = "";
            el('charCount').innerText = "Символов: 0";
            el('fileChooser').value = "";
            el('fileStatus').innerText = "Поддерживаются файлы .docx и .txt";
        });
    </script>
</body>
</html>
